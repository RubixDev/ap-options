<mat-expansion-panel [expanded]="!group().collapsed">
  <mat-expansion-panel-header>
    <mat-panel-title> {{ group().name }} </mat-panel-title>
  </mat-expansion-panel-header>

  <div class="options">
    @for (option of filteredOptions(); track option.name) {
      <app-option-edit [option]="option" [form]="form()[option.name]!" />
    }
  </div>
</mat-expansion-panel>
